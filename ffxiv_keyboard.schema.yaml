# ffxiv_keyboard.schema.yaml
schema:
  schema_id: ffxiv_keyboard
  name: 魔光键影
  version: "0.1.0"
  author:
    - 旅者 <nobody@example.com>
  description: |
    Rime 小鸡Simle"

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

translator:
  dictionary: ffxiv_keyboard_dict
  enable_user_dict: false
  enable_completion: true
  enable_sentence: false

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - abbrev/^(.).+$/$1/